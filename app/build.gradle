plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.wx.multiwindow'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.wx.multiwindow'
        minSdk = 24
        targetSdk = 36
        versionCode = 2
        versionName = '2.0.0'
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        // 截图生成器默认跳过；-Pscreenshots 时开启并写入仓库的 screenshot/ 目录
        unitTests.all {
            if (project.hasProperty('screenshots')) {
                it.systemProperty 'screenshots', 'true'
                it.systemProperty 'screenshotDir', rootProject.file('screenshot').absolutePath
                it.outputs.upToDateWhen { false }
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
